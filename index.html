<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Soccer Field</title>
    <!-- Include Bootstrap CSS -->
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* Basic styling for the field */
        .soccer-field {
            background-color: #4CAF50; /* Green */
            border: 3px solid white;
            height: 400px; /* Example height */
            position: relative; /* Needed for positioning elements inside */
            color: white;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
            /* Add more styles for lines, goals, etc. */
        }

        /* Ensure field takes full height of its column */
        .row > [class*='col-'] {
            display: flex;
            flex-direction: column;
        }
        .soccer-field-container {
            flex-grow: 1;
        }

        /* Example: Make text smaller on smaller screens */
        @media (max-width: 767.98px) {
            .soccer-field {
                font-size: 0.8rem;
                height: 300px; /* Adjust height for smaller screens */
            }
        }
    </style>
</head>
<body>

<div class="container mt-4">
    <!-- Bootstrap Row -->
    <div class="row justify-content-center">
        <!--
           Bootstrap Column:
           - col-12: Takes full width (12 columns) on extra small screens (mobile default).
           - col-md-10: Takes 10 out of 12 columns on medium screens and up (tablets, desktops).
           - col-lg-8: Takes 8 out of 12 columns on large screens and up (larger desktops).
           You can adjust these breakpoints (sm, md, lg, xl, xxl) and column counts as needed.
        -->
        <div class="col-12 col-md-10 col-lg-8 soccer-field-container">
            <!-- Your Soccer Field Content Goes Here -->
            <div class="soccer-field">
                <h1>Soccer Field</h1>
                <!-- Add other field elements like lines, goals, center circle etc. -->
                <h1>Soccer Tactics Board</h1>
                <div class="toolbar">
                    <button id="clearBtn">Clear Current Board</button>
                    <div class="color-picker">
                        <span>Color:</span>
                        <button class="color-btn" data-color="blue" style="background-color: blue;"></button>
                        <button class="color-btn" data-color="red" style="background-color: red;"></button>
                        <button class="color-btn" data-color="yellow" style="background-color: yellow;"></button>
                        <button class="color-btn" data-color="white" style="background-color: white; border: 1px solid #ccc;"></button>
                        <button class="color-btn" data-color="black" style="background-color: black;"></button>
                    </div>
                </div>
                <canvas id="tacticsCanvas" ></canvas>
            
                <div class="board-navigation">
                    <button id="prevBoardBtn" title="Previous Board">&lt;</button>
                    <span id="boardIndicator">Board 1 of 1</span>
                    <button id="nextBoardBtn" title="Next Board">&gt;</button>
                    <button id="addBoardBtn" title="Add New Board">+</button>
                    <button id="playBtn" title="Play Boards">▶ Play</button> <!-- Added Play Button -->
                </div>
            </div>
            <!-- End Soccer Field Content -->
        </div>
    </div>
</div>

<!-- Include Bootstrap JS (Optional, but often needed for components) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="script.js"></script>
</body>
</html>
